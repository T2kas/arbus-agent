name: circuit-breaker

# The circuit breaker: scan live prices + trades, alert Telegram on suspicious
# flow, and (optionally) stop trading on the tripped markets. No LLM, so it is
# cheap to run often.
#
# TOGGLE (no code edit): Settings → Secrets and variables → Actions → Variables
#   WATCH_ENABLED = true   → the schedule runs. Set to false to pause it while
#                            you are testing. Manual "Run workflow" always works.
#   WATCH_FREEZE  = true   → also stop trading on tripped markets (needs the
#                            ARBUS_WRITE_KEY secret). Leave unset to only alert.
#   CB_PRICE_MOVE / CB_MIN_DISTINCT_USERS / CB_WINDOW_MINUTES → override the
#                            thresholds (defaults: 0.20 / 3 / 10). Unset = default.

on:
  schedule:
    # Kas 5 min — GitHub'o realus scheduled minimumas, ir 10-min langui to visiškai
    # gana. Vienas švarus paleidimas kaskart (log'as aiškus, output'as išplaunamas
    # normaliai). Nori dažniau/rečiau — keisk šitą eilutę (pvz. "*/15 * * * *").
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      freeze:
        description: "Also stop trading on tripped markets (this run only)"
        type: boolean
        default: false

permissions:
  contents: write                    # to commit the breaker watermark ledger back

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    # Scheduled runs obey the WATCH_ENABLED toggle; a manual run always proceeds.
    if: github.event_name == 'workflow_dispatch' || vars.WATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the circuit breaker
        env:
          PYTHONUNBUFFERED: "1"        # output shows in the log, not buffered
          ARBUS_API_URL: ${{ secrets.ARBUS_API_URL }}
          ARBUS_API_KEY: ${{ secrets.ARBUS_API_KEY }}
          ARBUS_WRITE_KEY: ${{ secrets.ARBUS_WRITE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CB_PRICE_MOVE: ${{ vars.CB_PRICE_MOVE }}
          CB_MIN_DISTINCT_USERS: ${{ vars.CB_MIN_DISTINCT_USERS }}
          CB_WINDOW_MINUTES: ${{ vars.CB_WINDOW_MINUTES }}
          # Stricter breaker for markets a user has proposed a result for
          # (needs ARBUS_WRITE_KEY above to read the proposals). Defaults:
          # 0.10 / 3 / 30 if the Variables are left unset.
          CB_PROPOSED_PRICE_MOVE: ${{ vars.CB_PROPOSED_PRICE_MOVE }}
          CB_PROPOSED_MIN_DISTINCT_USERS: ${{ vars.CB_PROPOSED_MIN_DISTINCT_USERS }}
          CB_PROPOSED_WINDOW_MINUTES: ${{ vars.CB_PROPOSED_WINDOW_MINUTES }}
          # Jei freeze RPC vardas/parametras kitoks — nustatyk šiuos Variables
          # (kitaip naudoja numatytus: admin_freeze_market / market_id).
          APP_FREEZE_RPC: ${{ vars.APP_FREEZE_RPC }}
          APP_UNFREEZE_RPC: ${{ vars.APP_UNFREEZE_RPC }}
          APP_FREEZE_RPC_PARAM: ${{ vars.APP_FREEZE_RPC_PARAM }}
        run: |
          FREEZE=""
          if [ "${{ github.event.inputs.freeze }}" = "true" ] || [ "${{ vars.WATCH_FREEZE }}" = "true" ]; then
            FREEZE="--freeze"
          fi
          # One clean pass per scheduled run — the process exits normally, so its
          # output flushes to the log every time.
          python -m arbus watch $FREEZE

      - name: Commit the breaker watermark ledger if it changed
        # Only tripped markets change it, so most runs commit nothing. This is
        # what stops a reopened market from being re-closed on the same old jump.
        run: |
          git config user.name "arbus-bot"
          git config user.email "arbus-bot@users.noreply.github.com"
          git add state/breaker_watermarks.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "breaker watermarks $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
