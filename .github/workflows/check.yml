name: resolution-check

# When a user proposes a resolution, the app closes the market. This picks up
# newly closed/frozen markets, has the AI verify the outcome, and posts a
# Telegram summary. It decides nothing — the admin resolves in the dashboard.
#
# Only NEW markets are checked (--only-new): a committed ledger
# (state/checked_markets.json) remembers what was already handled, so a stateless
# CI run does not re-check (and re-bill) the whole backlog every time. Baseline it
# once locally with `arbus check --mark-seen` before enabling.
#
# TOGGLE: Settings → Variables → CHECK_ENABLED = true runs the schedule.

on:
  schedule:
    - cron: "*/15 * * * *"          # pick up proposals within ~15 min
  workflow_dispatch:
    inputs:
      deep:
        description: "Pay for the web hunt on no-data markets (this run only)"
        type: boolean
        default: true

permissions:
  contents: write                    # to commit the ledger back

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check newly proposed/closed markets
        env:
          PYTHONUNBUFFERED: "1"
          ARBUS_API_URL: ${{ secrets.ARBUS_API_URL }}
          ARBUS_API_KEY: ${{ secrets.ARBUS_API_KEY }}
          # Resolution check on Perplexity (search-native, cheap) with its
          # reasoning model. Switch back to Anthropic by setting these Variables.
          LLM_PROVIDER_AICHECK: ${{ vars.LLM_PROVIDER_AICHECK || 'perplexity' }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_AICHECK_MODEL: ${{ vars.PERPLEXITY_AICHECK_MODEL || 'sonar-reasoning-pro' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DEEP="--deep"
          if [ "${{ github.event.inputs.deep }}" = "false" ]; then DEEP=""; fi
          python -m arbus check --only-new $DEEP

      - name: Commit the ledger if it changed
        run: |
          git config user.name "arbus-bot"
          git config user.email "arbus-bot@users.noreply.github.com"
          git add state/checked_markets.json
          git diff --cached --quiet || git commit -m "check ledger $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
