name: games-bot
# Creates LKL (basketball), TOPLYGA (football) and Žalgiris EuroLeague game
# markets about a week ahead (GAMES_HORIZON_DAYS, default 8):
#   • Monday 07:30 Vilnius — the main run: every game of the coming week whose
#     bookmaker odds are already out;
#   • every day 08:00 and 17:00 — catch-up: games whose odds appeared since
#     (bookmakers publish ~1-5 days before tip-off, so a Monday-only run would
#     miss the weekend games).
# Opening prices = bookmaker consensus (median over ~10-20 bookmakers, margin
# removed with the power method so the favourite keeps its edge). Games without
# odds wait. lkl.lt blocks GitHub's servers (Cloudflare 403), so in CI the LKL
# schedule falls back to BetExplorer and those markets close at 12:00 on game
# day. Each market gets a "home logo VS away logo" picture. No LLM, costs 0.
# On by default; set Variable GAMES_ENABLED=false to stop the schedule.
on:
  schedule:
    - cron: "30 5 * * 1"           # Monday 07:30 Vilnius — weekly main run
    - cron: "0 6,15 * * *"         # daily 08:00 / 17:00 Vilnius — catch-up for new odds
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list, do not create"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: games
  cancel-in-progress: false

jobs:
  games:
    if: github.event_name == 'workflow_dispatch' || vars.GAMES_ENABLED != 'false'
    # On the Arbus VPS (self-hosted runner, label arbus-vps): lkl.lt refuses GitHub's IPs (403)
    # and BetExplorer rate-limits them (429), so from GitHub every game waited for odds forever.
    # From the VPS the schedule comes from BetExplorer's fixtures and the odds load.
    runs-on: [self-hosted, arbus-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create game markets
        env:
          PYTHONUNBUFFERED: "1"
          ARBUS_API_URL: ${{ secrets.ARBUS_API_URL }}
          ARBUS_API_KEY: ${{ secrets.ARBUS_API_KEY }}
          ARBUS_WRITE_KEY: ${{ secrets.ARBUS_WRITE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_CREATE_RPC: ${{ vars.APP_CREATE_RPC }}
          GAMES_LEAGUES: ${{ vars.GAMES_LEAGUES }}
          GAMES_HORIZON_DAYS: ${{ vars.GAMES_HORIZON_DAYS }}
          GAMES_LIQUIDITY: ${{ vars.GAMES_LIQUIDITY }}
          GAMES_LKL_IMAGE: ${{ vars.GAMES_LKL_IMAGE }}
          GAMES_TOP_IMAGE: ${{ vars.GAMES_TOP_IMAGE }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python -m arbus games $FLAGS
