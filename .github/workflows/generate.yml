name: generate-markets

# Manual-only for now: run from the Actions tab ("Run workflow").
# To add a schedule later, add a `schedule:` block with a cron expression.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Candidates to generate"
        default: "35"

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate batch
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: enriches the PULSE stage (YouTube Trending LT). Inert if unset.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m arbus generate --count "${{ github.event.inputs.count || '35' }}"

      - name: Commit batch back
        run: |
          git config user.name "arbus-bot"
          git config user.email "arbus-bot@users.noreply.github.com"
          git add data/ reports/ exports/
          git diff --cached --quiet || git commit -m "batch $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
